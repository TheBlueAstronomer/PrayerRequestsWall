services:
  app:
    # Always use the image passed from deploy script/CI
    image: ${DEPLOY_IMAGE}
    restart: unless-stopped
    ports:
      - "80:3000"
    volumes:
      # Use HOST_DATA_PATH if set (prod), else default to current dir (dev)
      - ${HOST_DATA_PATH:-.}/sqlite.db:/app/sqlite.db
      # Baileys credentials. Container-side path must match DEFAULT_AUTH_DIR in
      # src/lib/whatsapp.ts.
      - ${HOST_DATA_PATH:-.}/.baileys_auth:/app/.baileys_auth
    environment:
      - NODE_ENV=production
      - WA_AUTH_PATH=/app/.baileys_auth
    env_file:
      - .env
