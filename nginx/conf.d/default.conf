server {
    listen 80;
    server_name tribeprayer.org www.tribeprayer.org;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name tribeprayer.org www.tribeprayer.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/tribeprayer.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tribeprayer.org/privkey.pem;

    # Include basic let's encrypt TLS config if available
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy to the application container
    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 90s, explicitly. There was NO proxy_read_timeout here before, so nginx's
        # 60s default applied — and POST /api/submit awaits one WhatsApp send per
        # configured group, serially, inside the request. Each send is bounded by
        # WA_SEND_RELAY_TIMEOUT_MS (10s) + WA_ACK_TIMEOUT_MS (20s) = 30s worst case.
        #
        # One group is configured today, so the worst case is 30s and fits. Two
        # groups would be 60s — exactly at the old default, i.e. a coin-flip 504 —
        # and three would be 90s and always fail. Nothing caps the group count:
        # whatsapp_group_ids is a free-form comma-separated app setting, so an admin
        # adding a group could turn a working site into 504s with no code change and
        # no obvious connection to what they did.
        #
        # 90s removes that cliff for up to three groups instead of relying on the
        # count staying at one. It also covers POST /api/admin/logout, which is
        # bounded by the 5s socket-teardown ceiling, and the 504 observed at ~62s
        # during the 2026-08-07 outage was this default plus connect overhead.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
